name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    name: Build (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FubarDev.FtpServer.sln

      - name: Build
        run: dotnet build FubarDev.FtpServer.sln --configuration Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FubarDev.FtpServer.sln

      - name: Test
        run: dotnet test test/FubarDev.FtpServer.Tests/FubarDev.FtpServer.Tests.csproj --configuration Debug --no-restore --logger "console;verbosity=normal"

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FubarDev.FtpServer.sln

      - name: Verify formatting
        run: dotnet format FubarDev.FtpServer.sln --verify-no-changes --no-restore

  no-framework-ifdefs:
    name: No framework #if guards in src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for framework-conditional compilation
        run: |
          if git grep -nE '#if .*(NETSTANDARD|NETCOREAPP|NET4|NET5|NET6|NET7|NET8)' -- src; then
            echo
            echo "Framework-conditional #if guards were found under src/."
            echo "Only net10.0 is targeted; remove the guard and keep the net10.0 branch."
            exit 1
          fi

  gnutls-close-notify-check:
    name: GnuTLS close_notify regression check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Restore
        run: dotnet restore samples/TestFtpServer/TestFtpServer.csproj

      - name: Run real server against a GnuTLS client (lftp)
        run: .github/scripts/gnutls-close-notify-check.sh
